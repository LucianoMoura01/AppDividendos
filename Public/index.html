<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppDividendos - Efeito Bola de Neve</title>
    <meta name="description" content="Controle de patrimônio, dividendos e efeito bola de neve - App local-first">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>&#10052;&#65039; Bola de Neve</h1>
                <p>AppDividendos</p>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" data-tab="dashboard">
                    <span class="nav-icon">&#128202;</span> Dashboard
                </a>
                <a class="nav-item" data-tab="carteira">
                    <span class="nav-icon">&#128200;</span> Carteira ao Vivo
                </a>
                <a class="nav-item" data-tab="lancamentos">
                    <span class="nav-icon">&#10133;</span> Lan&ccedil;amentos
                </a>
                <a class="nav-item" data-tab="metas">
                    <span class="nav-icon">&#127919;</span> Metas & Bola de Neve
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="sync-badge" id="btnSync" title="Sincronizar cota&ccedil;&otilde;es">
                    <span class="dot"></span>
                    <span id="syncStatus">Clique para sincronizar</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- Toast container for notifications -->
            <div class="toast-container" id="toastContainer"></div>

            <!-- Tab content rendered here by JS -->
            <div id="tabContent">
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <span>Carregando...</span>
                </div>
            </div>
        </main>

    </div>

    <!-- DETAIL MODAL (for asset details) -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <!-- Rendered by detalhes.js -->
        </div>
    </div>

    <!-- JS Modules -->
    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/carteira.js"></script>
    <script src="/js/lancamentos.js"></script>
    <script src="/js/metas.js"></script>
    <script src="/js/detalhes.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
